name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @colorshot/core test
      - run: pnpm build
      - run: pnpm size
      - name: Package checks (publint, types)
        run: |
          cd packages/colorshot
          npx --yes publint --strict
          npx --yes @arethetypeswrong/cli --pack . --exclude-entrypoints styles.css
      - name: Browser tests (Chromium, Firefox, WebKit)
        run: |
          pnpm --filter @colorshot/playground exec playwright install --with-deps chromium firefox webkit
          pnpm --filter @colorshot/playground test:e2e
